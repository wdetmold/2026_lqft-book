name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notation and reference lints
        run: python3 tools/lint_notation.py
      - name: Compile book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
      - name: Check for undefined references
        run: |
          ! grep -E "(Reference|Citation) .* undefined" main.log || \
            (echo "::warning::undefined references present"; true)
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: main.pdf
